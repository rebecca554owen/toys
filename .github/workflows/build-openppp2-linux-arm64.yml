name: build-openppp2-linux-arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '输入 openppp2 的 tag 名称'
        required: true
        default: 'v2.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Linux aarch64 ${{ matrix.suffix }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            enable_sysnat: "OFF"

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      BOOST_VERSION: 1.86.0

    steps:
    - name: Checkout openppp2 repository
      uses: actions/checkout@v6
      with:
        repository: rebecca554owen/openppp2
        path: openppp2
        ref: "${{ github.event.inputs.tag || github.ref_name }}"

    - name: Install Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake git zip unzip curl \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Get openppp2 tag
      id: get-tag
      run: |
        TAG="${{ github.event.inputs.tag || github.ref_name }}"
        SHORT_SHA="$(git -C openppp2 rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "app_version=${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

    - name: Validate openppp2 tag
      run: |
        if [[ ! "${{ steps.get-tag.outputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "错误：标签格式无效，应为v*.*.*"
          exit 1
        fi

    - name: Set artifact name
      run: |
        echo "ARTIFACT_NAME=openppp2-linux-aarch64${{ matrix.suffix }}.zip" >> $GITHUB_ENV

    - name: Set version in source code
      run: |
        APP_VERSION="${{ steps.get-tag.outputs.app_version }}"
        cd openppp2
        sed -i "s/#define PPP_APPLICATION_VERSION (\"[^\"]*\")/#define PPP_APPLICATION_VERSION (\"${APP_VERSION}\")/" ppp/stdafx.h

    - name: Clone third-party environment
      run: |
        git clone --depth 1 https://github.com/liulilittle/openppp2-ubuntu-3rd-environment.git "$RUNNER_TEMP/3rd"

    - name: Cache Boost for Linux aarch64
      id: cache-boost
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/third-party/boost-aarch64
        key: linux-aarch64-boost-${{ env.BOOST_VERSION }}-gcc-cross-ubuntu22-v1

    - name: Build Boost for Linux aarch64
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
        set -euxo pipefail
        boost_version_underscore="${BOOST_VERSION//./_}"
        boost_root="$GITHUB_WORKSPACE/third-party/boost-aarch64"
        archive="$RUNNER_TEMP/boost_${boost_version_underscore}.tar.gz"

        mkdir -p "$GITHUB_WORKSPACE/third-party"
        curl -L --fail --retry 5 \
          -o "$archive" \
          "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${boost_version_underscore}.tar.gz"
        rm -rf "$boost_root" "$RUNNER_TEMP/boost_${boost_version_underscore}"
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        mv "$RUNNER_TEMP/boost_${boost_version_underscore}" "$boost_root"

        user_config="$RUNNER_TEMP/boost-user-config.jam"
        cat > "$user_config" <<'EOF'
        using gcc : aarch64 : aarch64-linux-gnu-g++ :
            <archiver>aarch64-linux-gnu-ar
            <ranlib>aarch64-linux-gnu-ranlib
        ;
        EOF

        cd "$boost_root"
        ./bootstrap.sh
        ./b2 -j"$(nproc)" \
          --user-config="$user_config" \
          --layout=system \
          toolset=gcc-aarch64 \
          target-os=linux \
          binary-format=elf \
          architecture=arm \
          address-model=64 \
          abi=aapcs \
          context-impl=fcontext \
          cxxflags=-fPIC \
          link=static \
          runtime-link=static \
          threading=multi \
          variant=release \
          --with-system \
          --with-coroutine \
          --with-thread \
          --with-context \
          --with-regex \
          --with-filesystem \
          stage

    - name: Use and verify Boost 1.86.0 for Linux aarch64
      run: |
        set -euxo pipefail
        boost_root="$GITHUB_WORKSPACE/third-party/boost-aarch64"
        target_boost="$RUNNER_TEMP/3rd/aarch64/boost"

        grep -Eq '^#define BOOST_VERSION 108600$' \
          "$boost_root/boost/version.hpp"
        for lib in system coroutine thread context regex filesystem; do
          archive="$boost_root/stage/lib/libboost_${lib}.a"
          test -s "$archive"
          test -n "$(aarch64-linux-gnu-ar t "$archive")"
        done

        object_name="$(aarch64-linux-gnu-ar t \
          "$boost_root/stage/lib/libboost_context.a" | sed -n '1p')"
        test -n "$object_name"
        verify_dir="$(mktemp -d)"
        (
          cd "$verify_dir"
          aarch64-linux-gnu-ar x \
            "$boost_root/stage/lib/libboost_context.a" "$object_name"
          aarch64-linux-gnu-readelf -h "$object_name" | \
            grep -q 'Machine:.*AArch64'
        )

        nm_output="$(aarch64-linux-gnu-nm -g --defined-only \
          "$boost_root/stage/lib/libboost_context.a")"
        printf '%s\n' "$nm_output" | grep -Eq ' (make_fcontext)$'
        printf '%s\n' "$nm_output" | grep -Eq ' (jump_fcontext)$'
        printf '%s\n' "$nm_output" | grep -Eq ' (ontop_fcontext)$'

        rm -rf "$target_boost"
        ln -s "$boost_root" "$target_boost"

    - name: Build libunwind for target
      run: |
        set -euxo pipefail
        cd "$RUNNER_TEMP"
        curl -L --fail --retry 5 \
          -o libunwind-1.8.1.tar.gz \
          https://github.com/libunwind/libunwind/releases/download/v1.8.1/libunwind-1.8.1.tar.gz
        tar xf libunwind-1.8.1.tar.gz
        cd libunwind-1.8.1
        ./configure --host=aarch64-linux-gnu --prefix="$RUNNER_TEMP/libunwind" --disable-shared --enable-static
        make -j "$(nproc)"
        make install

    - name: Build openppp2
      run: |
        cd openppp2
        TP="$RUNNER_TEMP/3rd/aarch64"
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_EXE_LINKER_FLAGS="-L$RUNNER_TEMP/libunwind/lib" \
          -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
          -DENABLE_SYSNAT=${{ matrix.enable_sysnat }}
        make -j "$(nproc)"

    - name: Package openppp2
      run: |
        cd openppp2/bin
        zip -r "${{ env.ARTIFACT_NAME }}" ppp

    - name: Upload openppp2
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: openppp2/bin/${{ env.ARTIFACT_NAME }}

    - name: Record build time
      run: |
        echo "BUILD_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.get-tag.outputs.tag }}
        artifacts: openppp2/bin/${{ env.ARTIFACT_NAME }}
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: true
        body: |
          Version: ${{ steps.get-tag.outputs.app_version }}
          Build Time: ${{ env.BUILD_TIME }}
